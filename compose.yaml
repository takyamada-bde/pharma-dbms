services:
  postgres:
    image: tyamadabiodataeng/pharma-dbms-postgres
    container_name: postgres
    build:
      context: ./postgres
      dockerfile: ../dockerfiles/postgres/Dockerfile
    environment:
      - TZ=Asia/Tokyo
    env_file:
      - ./postgres/.env
    ports:
      - "5432:5432"
    volumes:
      - pharmadb_pg_data:/var/lib/postgresql
    networks:
      - pharmadb-network
  django:
    image: tyamadabiodataeng/pharma-dbms-django
    container_name: django
    build:
      context: ./app
      dockerfile: ../dockerfiles/django/Dockerfile
    command: gunicorn config.wsgi.prod:application --bind 0.0.0.0:8000
    volumes:
      - ./app:/app
    expose:
      - "8000"
    env_file:
      - ./app/config/.env
    depends_on:
      - postgres
    networks:
      - pharmadb-network
  nginx:
    image: tyamadabiodataeng/pharma-dbms-nginx
    container_name: nginx
    build: 
      context: ./nginx
      dockerfile: ../dockerfiles/nginx/Dockerfile
    volumes:
      - ./app/static:/usr/src/static
      - ./app/media:/usr/src/media
    ports:
      - "80:80"
    depends_on:
      - django
    networks:
      - pharmadb-network

networks:
  pharmadb-network:
    driver: bridge

volumes:
  pharmadb_pg_data:
