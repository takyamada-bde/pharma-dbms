[project]
name = "pharma-dbms-app"
version = "0.1.0"
description = "A django application for managing pharmaceutical databases."
requires-python = ">=3.12"
dependencies = [
    "django=5.2",
    "django-ninja",
    "uuid6",
    "structlog",
    "psycopg",
    "uvicorn",
    "gunicorn",
    "django-auditlog",
    "django-environ",
    "django-extensions",
    "django-filter",
    "django-guardian",
    "django-import-export",
    "django-silk",
    "django-structlog",
    "sentry-sdk",
    "rdkit",
]

[dependency-groups]
dev = [
    "black",
    "ruff",
    "mypy",
    "tox",
    "zensical",
    "django-debug-toolbar",
    "factory_boy",
    "pytest",
    "pytest-cov",
    "pytest-django",
    "pytest-factoryboy",
    "pytest-randomly",
]

[tool.tox]
legacy_tox_ini = """
    [tox]
    skipdist = True
    env_list = 
        black
        ruff
        mypy
        pytest

    [black]
    deps = black
    commands = black .

    [ruff]
    deps = ruff
    commands = ruff check .

    [mypy]
    deps = mypy
    commands = mypy .

    [pytest]
    deps = 
        pytest
        pytest-django
    commands = pytest
"""

[tool.ruff]
lint.ignore = ['E501']
lint.select = [
    'C9',  # mccabe
    'E',  # pycodestyle Error
    'F',  # PyFlakes
    'W',  # pycodestyle Warning
    'I',  # isort
]
line-length = 120
src = ['.']

[tool.ruff.format]
quote-style = 'single'

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
addopts = "-v --reuse-db"
django_debug_mode = true
