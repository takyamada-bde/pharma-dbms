services:
  postgres:
    image: tyamadabiodataeng/pharma-dbms-postgres-dev
    container_name: postgres
    build:
      context: ./postgres
      dockerfile: ../dockerfiles/postgres/Dockerfile
    environment:
      - TZ=Asia/Tokyo
    env_file:
      - ./postgres/.env.dev
    ports:
      - "5432:5432"
    volumes:
      - pharmadb_dev_pg_data:/var/lib/postgresql
    networks:
      - pharmadb-dev-network
  django:
    image: tyamadabiodataeng/pharma-dbms-django-dev
    container_name: django
    build:
      context: ./app
      dockerfile: ../dockerfiles/django/Dockerfile.dev
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             gunicorn config.wsgi.dev:application --bind 0.0.0.0:8000"
    volumes:
      - ./app:/app
    expose:
      - "8000"
    env_file:
      - ./app/config/.env.dev
    depends_on:
      - postgres
    networks:
      - pharmadb-dev-network
  nginx:
    image: tyamadabiodataeng/pharma-dbms-nginx
    container_name: nginx
    build:
      context: ./nginx
      dockerfile: ../dockerfiles/nginx/Dockerfile
    volumes:
      - ./app/static:/usr/src/static
      - ./app/media:/usr/src/media
    ports:
      - "80:80"
    depends_on:
      - django
    networks:
      - pharmadb-dev-network
  jupyter:
    build: 
      context: ./notebooks
      dockerfile: ../dockerfiles/jupyter/Dockerfile
    image: tyamadabiodataeng/pharma-dbms-jupyter
    container_name: jupyter
    command: jupyter lab --ip=0.0.0.0 --allow-root --LabApp.token=''
    ports:
     - "8888:8888"
    volumes:
     - ./notebooks:/app
    depends_on:
      - nginx
    networks:
      - pharmadb-dev-network

networks:
  pharmadb-dev-network:
    driver: bridge

volumes:
  pharmadb_dev_pg_data:
